name: Publish portable release

on:
  push:
    branches: [main]
    paths: ['releases/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-portable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source and version tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build tagged source and publish new releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .\scripts\publish-releases.ps1
